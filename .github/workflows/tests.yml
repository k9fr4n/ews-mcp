# CI: everything BLOCKING — no continue-on-error anywhere in this file.
# Also callable from publish.yml so publishing can never skip the tests.
name: tests

on:
  push:
    branches: ["**"]
    paths:
      - "ewsmcp/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "deploy/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "ewsmcp/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "deploy/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/**"
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (blocking)
        run: ruff check .
      - name: Format check (blocking)
        run: ruff format --check .
      - name: Unit + contract suites and coverage gate (blocking)
        run: >-
          python -m pytest tests -q
          --cov=ewsmcp
          --cov-report=term-missing
          --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
          --cov-fail-under=79.1993
      - name: Docs match the registry (blocking)
        run: python scripts/dump_tool_table.py --check

  boot-smoke:
    # No-Exchange end-to-end: the real HTTP server against a dead endpoint —
    # never-exit boot, tier filtering, kill-switch, cold-gate, OpenAPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install .
      - name: Boot smoke (tier=full)
        run: python scripts/boot_smoke.py full
      - name: Boot smoke (tier=draft)
        run: python scripts/boot_smoke.py draft
      - name: Boot smoke (cache disabled)
        env:
          EWS_CACHE_ENABLED: "false"
        run: python scripts/boot_smoke.py full

  docker-build:
    needs: [tests, boot-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ews-mcp:ci .
      - name: Import smoke inside the image
        run: docker run --rm ews-mcp:ci python -c "import ewsmcp.main, ewsmcp.http, ewsmcp.cache.store; print('import smoke OK')"
