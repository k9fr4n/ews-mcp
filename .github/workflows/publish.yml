# Publish the image to GHCR on v1.* tags — gated on the FULL test
# workflow (no continue-on-error anywhere).
name: publish

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

on:
  push:
    tags: ["v1.*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        run: |
          REF="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="v1-manual-${GITHUB_SHA::8}"
          fi
          echo "exact=${IMAGE_NAME}:${REF}" >> "$GITHUB_OUTPUT"
          echo "line=${IMAGE_NAME}:v1" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Release tags are immutable; :v1 and :latest are moving aliases.
          tags: |
            ${{ steps.tags.outputs.exact }}
            ${{ steps.tags.outputs.line }}
            ${{ steps.tags.outputs.latest }}
          labels: |
            org.opencontainers.image.title=ews-mcp
            org.opencontainers.image.description=MCP server for Microsoft Exchange / Office 365
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
